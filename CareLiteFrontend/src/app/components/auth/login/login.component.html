<div class="login-container">
  <h2>Login</h2>

  <form [formGroup]="form">
    
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Enter username"
      />
      @if (formControl.username.touched && formControl.username.invalid) {
        <small class="error">Username is required</small>
      }
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter password"
      />
      @if (formControl.password.touched && formControl.password.invalid) {
        <small class="error">Password is required</small>
      }
    </div>
    <button type="submit" [disabled]="form.invalid" (click)="SubmitForm()">
      Login
    </button>
  </form>
   <span>Dont have an account? <a [routerLink]="'/signup'">signup</a></span>
</div>

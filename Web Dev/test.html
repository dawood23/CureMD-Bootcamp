<body>
    <button class="Add-Button">Add</button>
    <div style="display: none;" class="add-form-container">
        <h2>Add Item</h2>
        <form action="">
            <label for="title">Enter Description</label>
            <input type="text" name="Title" id="title">

            <input type="radio" id="statusIncomplete" name="status" value="not completed">
            
            <button id="confirm-add">Confirm Add</button>
        </form>
    </div>

    </div>

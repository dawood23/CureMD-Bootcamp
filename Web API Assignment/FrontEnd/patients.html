<!DOCTYPE html>
<html>
  <head>
    <title>Patients</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body onload="setupDashboard()">
    <script src="common.js"></script>
    <script>
      restrictAccess(["Admin", "Doctor", "Receptionist"]);
    </script>

    <nav>
      <div id="adminLinks" style="display: none">
        <a href="users.html">Users</a> |
        <a href="userroles.html">User Roles</a> |
        <a href="visittypes.html">Visit Types</a> |
        <a href="doctors.html">Doctors</a> |
        <a href="patients.html">Patients</a> |
        <a href="visits.html">Visits</a>
      </div>
      <div id="doctorLinks" style="display: none">
        <a href="patients.html">Patients</a> |
        <a href="visits.html">Visits</a>
      </div>
      <div id="receptionLinks" style="display: none">
        <a href="patients.html">Patients</a> |
        <a href="visits.html">Visits</a> |
        <a href="visittypes.html">Visit Types</a>
      </div>
      <a href="#" onclick="clearToken()">Logout</a>
    </nav>

    <h2>Patients</h2>
    <button id="refreshBtn">Refresh</button>
    <table class="grid" id="grid">
      <thead>
        <tr>
          <th>ID</th>
          <th>First</th>
          <th>Last</th>
          <th>DOB</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 id="formTitle">Add / Edit Patient</h3>
    <form id="form">
      <input type="hidden" id="patientID" />
      <label>First Name</label>
      <input id="firstName" required />
      <label>Last Name</label>
      <input id="lastName" required />
      <label>Date of Birth</label>
      <input id="dateOfBirth" type="date" />
      <label>Phone</label>
      <input id="phoneNumber" />
      <label>Email</label>
      <input id="email" type="email" />
      <label>Address</label>
      <input id="address" />
      <label>Emergency Contact</label>
      <input id="emergencyContact" />
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="resetBtn" class="ghost">Reset</button>
      </div>
    </form>

    <script>
        function setupDashboard() {
        const role = getUserRole();
        if (role === "Admin")
          document.getElementById("adminLinks").style.display = "block";
        if (role === "Doctor")
          document.getElementById("doctorLinks").style.display = "block";
        if (role === "Receptionist")
          document.getElementById("receptionLinks").style.display = "block";
      }
      function load() {
        $.get(`${API_BASE}/Patients`, (list) => {
          const tb = $("#grid tbody").empty();
          list.forEach((p) => {
            tb.append(`<tr>
              <td>${p.patientID}</td>
              <td>${p.firstName}</td>
              <td>${p.lastName}</td>
              <td>${p.dateOfBirth ? p.dateOfBirth.substring(0, 10) : ""}</td>
              <td>${p.phoneNumber || ""}</td>
              <td>${p.email || ""}</td>
              <td>
                <button onclick='edit(${JSON.stringify(p)})'>Edit</button>
                <button class="del" onclick='del(${
                  p.patientID
                })'>Delete</button>
              </td>
            </tr>`);
          });
        });
      }
      function edit(p) {
        $("#patientID").val(p.patientID);
        $("#firstName").val(p.firstName);
        $("#lastName").val(p.lastName);
        $("#dateOfBirth").val(
          p.dateOfBirth ? p.dateOfBirth.substring(0, 10) : ""
        );
        $("#phoneNumber").val(p.phoneNumber || "");
        $("#email").val(p.email || "");
        $("#address").val(p.address || "");
        $("#emergencyContact").val(p.emergencyContact || "");
        $("#formTitle").text("Edit Patient");
      }
      function del(id) {
        if (!confirm("Delete this patient?")) return;
        const by = getPerformedByUserId();
        $.ajax({ url: `${API_BASE}/Patients/${id}/${by}`, method: "DELETE" })
          .done(load)
          .fail(() => alert("Delete failed"));
      }
      $("#form").on("submit", function (e) {
        e.preventDefault();
        const id = +($("#patientID").val() || 0);
        const payload = {
          patientID: id,
          firstName: $("#firstName").val().trim(),
          lastName: $("#lastName").val().trim(),
          dateOfBirth: $("#dateOfBirth").val() || null,
          phoneNumber: $("#phoneNumber").val().trim(),
          email: $("#email").val().trim(),
          address: $("#address").val().trim(),
          emergencyContact: $("#emergencyContact").val().trim(),
        };
        if (!payload.firstName || !payload.lastName) {
          alert("First & Last name required");
          return;
        }
        const by = getPerformedByUserId();
        const method = id ? "PUT" : "POST";
        $.ajax({
          url: `${API_BASE}/Patients/${by}`,
          method,
          contentType: "application/json",
          data: JSON.stringify(payload),
        })
          .done(() => {
            load();
            $("#resetBtn").click();
          })
          .fail(() => alert("Save failed"));
      });
      $("#resetBtn").on("click", function () {
        $("#patientID").val("");
        $(
          "#firstName,#lastName,#dateOfBirth,#phoneNumber,#email,#address,#emergencyContact"
        ).val("");
        $("#formTitle").text("Add / Edit Patient");
      });
      $("#refreshBtn").on("click", load);
      $(load);
    </script>
  </body>
</html>

<button class="back-button" (click)="cancel()">← Back</button>

<h2>Edit Appointment</h2>

@if (errorMessage) {
  <div class="error-message">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="success-message">{{ successMessage }}</div>
}

<form [formGroup]="form">
  <div>
    <label>Patient:</label>
    <input type="text" [value]="patientName" readonly />
    <input type="hidden" formControlName="patientID" [value]="patientid"/>
  </div>

  <div>
    <label>Doctor:</label>
    <select formControlName="doctorID">
      <option [ngValue]="null" disabled>Select a doctor</option>
      @for (d of doctors; track d.doctorID) {
        <option [value]="d.doctorID">{{ d.doctorName }}</option>
      }
    </select>
  </div>

  <div>
    <label>Start Time:</label>
    <input type="datetime-local" formControlName="startTime" />
  </div>

  <div>
    <label>Duration (minutes):</label>
    <select formControlName="durationMinutes">
      <option [value]="15">15</option>
      <option [value]="30">30</option>
      <option [value]="60">60</option>
    </select>
  </div>

  <div>
    <label>Status:</label>
    <select formControlName="status">
      <option value="Scheduled">Scheduled</option>
      <option value="Completed">Completed</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>

  <button type="submit" [disabled]="form.invalid" (click)="submit()">Update</button>
</form>

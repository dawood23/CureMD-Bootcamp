@if(contact?.name) {
  <div class="contact-details-div">
    <h2>Details</h2>
    <div class="contact-card details">
      <h3 class="name">{{ contact?.name }}</h3>

      <div class="detail"><strong>Phone:</strong> {{ contact?.phone }}</div>
      <div class="detail"><strong>Email:</strong> {{ contact?.email }}</div>
      <div class="detail"><strong>Gender:</strong> {{ contact?.gender }}</div>
      <div class="detail"><strong>Address:</strong> {{ contact?.address }}</div>

      <div class="groups">
        <strong>Groups:</strong>
        @if(contact?.groups?.length > 0) {
          <span>
            {{ contact?.groups?.join(", ") }}
          </span>
        }
        @else {
          <span>
            No groups added
          </span>
        }
      </div>

      <button (click)="toggle('Favourites')">Toggle Favourite</button>
      <button (click)="toggle('Family')">Toggle Family</button>
      <button (click)="toggle('Friends')">Toggle Friends</button>
      <button (click)="toggle('Classmates')">Toggle Classmates</button>
    </div>
  </div>
}

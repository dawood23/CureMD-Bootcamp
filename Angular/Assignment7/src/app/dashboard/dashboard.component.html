<h1 style="display: flex; align-items: center; justify-content: center;">Contact List Assignment</h1>
<div class="maincomponent">
 <app-contact-list 
  [contactList]="contacts" 
  (id)="displayCardDetails($event)"
  class="left-side">
</app-contact-list>

  <div class="right-side">
    <app-contact-details [contact]="selectedContact" 
    (Toggle)="toggle($event)"
    ></app-contact-details>
  </div>
</div>

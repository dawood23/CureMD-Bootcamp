<div class="filters">
  <button (click)="noFilter()">All</button>
  <button (click)="filter('Family')">Family</button>
  <button (click)="filter('Favourites')">Favourites</button>
  <button (click)="filter('Friends')">Friends</button>
  <button (click)="filter('Classmates')">Classmates</button>
</div>
